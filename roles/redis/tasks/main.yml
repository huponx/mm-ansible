---
# Refresh apt package index to ensure latest package versions are available
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

# Install the Redis server package from the default Ubuntu apt repository
- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: "{{ 'latest' if redis_upgrade | bool else 'present' }}"
  become: true

- name: Check whether Redis is installed
  ansible.builtin.stat:
    path: /etc/redis/redis.conf
  register: redis_conf

# In a dry run on a server without Redis the install above is only simulated:
# there is no service or redis.conf to inspect, so the rest cannot be simulated.
- name: Configure Redis
  ansible.builtin.include_tasks: configure.yml
  when: not (ansible_check_mode and not redis_conf.stat.exists)

- name: Note that the configuration is not simulated
  ansible.builtin.debug:
    msg: "Redis is not installed yet: its configuration is skipped in this dry run."
  when: ansible_check_mode and not redis_conf.stat.exists
