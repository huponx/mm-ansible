---
- name: Create cluster issuer yaml from template
  ansible.builtin.template:
    src: cluster-issuer.yaml.j2
    dest: /tmp/cluster-issuer.yaml
    mode: "0644"

- name: Apply cluster issuer
  ansible.builtin.command: microk8s kubectl apply -f /tmp/cluster-issuer.yaml
  register: cluster_issuer_apply
  changed_when: "'unchanged' not in cluster_issuer_apply.stdout"
