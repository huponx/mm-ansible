---
# Enable the add-ons listed in microk8s_addons (see defaults/main.yml).
# --wait-ready: right after the install MicroK8s needs a while to start.
# Already enabled add-ons are skipped, and a failed readiness wait fails the run.
- name: Get enabled addons
  ansible.builtin.command: microk8s status --wait-ready --timeout {{ microk8s_ready_timeout }} --format yaml
  register: microk8s_status
  changed_when: false
  # Read-only: run it in --check too. On a fresh host MicroK8s is not installed yet
  # in a dry run (the install task is only simulated), so tolerate a failure there.
  check_mode: false
  failed_when: microk8s_status.rc | default(1) != 0 and not ansible_check_mode

- name: Parse enabled addons
  ansible.builtin.set_fact:
    addons_enabled: >-
      {{ ((microk8s_status.stdout | default('') | from_yaml) or {}).addons | default([])
         | selectattr('status', 'equalto', 'enabled')
         | map(attribute='name') | list }}

- name: Enable addons
  ansible.builtin.command: "microk8s enable {{ item.name }}{{ ':' + item.args if item.args | default('') | length > 0 else '' }}"
  loop: "{{ microk8s_addons }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in addons_enabled
  register: addons_result
  changed_when: true

- name: Wait for addon workloads to be ready
  ansible.builtin.command: >-
    microk8s kubectl wait {{ item.wait.kind | default('pod') }}
    {{ item.wait.selector }}
    -n {{ item.wait.namespace }}
    --for=condition={{ item.wait.condition | default('ready') }}
    --timeout={{ microk8s_wait_timeout }}s
  loop: "{{ microk8s_addons | selectattr('wait', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  # Nothing is enabled in a dry run, so there is nothing to wait for
  when: item.name not in addons_enabled and not ansible_check_mode
  changed_when: false
  # The pods may not exist yet right after `microk8s enable`: retry for up to 2 minutes
  retries: 12
  delay: 10
  register: addon_wait
  until: addon_wait.rc == 0
