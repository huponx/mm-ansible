---
microk8s_version: "1.36"
microk8s_wait_timeout: 120
# Seconds to wait for MicroK8s to be ready (first start after the install is slow)
microk8s_ready_timeout: 300

metallb_ip_range: "192.168.0.150-192.168.0.200"

# Add-ons enabled in this order. `args` is appended as `microk8s enable name:args`.
# `wait`: kind (default pod), selector (`-l key=value` or `--all`), namespace, condition. It blocks until the workload is ready (only right after the add-on was enabled).
microk8s_addons:
  - name: dns
    wait: { selector: "-l k8s-app=kube-dns", namespace: kube-system }
  - name: ingress
    wait: { selector: "--all", namespace: ingress }
  - name: hostpath-storage
  - name: metrics-server
  - name: metallb
    args: "{{ metallb_ip_range }}"
    wait: { selector: "-l app=metallb", namespace: metallb-system }
  - name: helm3
  - name: cert-manager
    wait: { kind: deployment, selector: "--all", namespace: cert-manager, condition: available }

# Internal CA (cert-manager) that signs the certificates of the in-cluster gRPC servers
internal_issuer_name: "internal-ca"
internal_ca_duration: "87600h"      # 10 years; clients trust this CA, so rotating it means redeploying the trust
internal_ca_renew_before: "720h"
