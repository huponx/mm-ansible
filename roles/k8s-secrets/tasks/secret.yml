---
# One entry of k8s_secrets (loop variable: ks).

- name: Describe the secret
  ansible.builtin.set_fact:
    ks_state: "{{ ks.state | default('present') }}"
    ks_mode: "{{ ks.mode | default('replace') }}"
    ks_type: "{{ ks.type | default('Opaque') }}"
    ks_vault_key: "{{ ks.secret | default(ks.namespace ~ '-' ~ ks.name) }}"
    ks_keys_absent: "{{ ks.keys_absent | default([]) }}"
    ks_labels: "{{ {k8s_secrets_managed_label: k8s_secrets_managed_value} }}"
    ks_protected: >-
      {{ ks.namespace == 'kube-system'
         or (ks.namespace == (argocd_namespace | default('argocd'))
             and (ks.name in ['argocd-secret', 'argocd-initial-admin-secret'] or ks.name is match('^(repo|creds)-'))) }}

- name: Validate the secret entry
  ansible.builtin.assert:
    that:
      - ks_state in ['present', 'absent']
      - ks_mode in ['replace', 'merge']
      - not (ks_protected | bool)
      - ks_keys_absent is sequence
      - ks_keys_absent is not string
      - ks_keys_absent | length == 0 or ks_mode == 'merge'
    fail_msg: >-
      {{ ks.namespace }}/{{ ks.name }}: state must be present or absent, mode replace or merge,
      keys_absent is only valid with mode merge, and kube-system or the ArgoCD internal secrets
      (argocd-secret, repo-*, creds-*) cannot be managed here.
    quiet: true

# ---------------------------------------------------------------- state: absent
- name: Read the Secret to delete
  ansible.builtin.command:
    argv: [microk8s, kubectl, get, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", -o, json, --ignore-not-found]
  register: ks_del_get
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: ks_state == 'absent'

- name: Parse the Secret to delete
  ansible.builtin.set_fact:
    ks_cur: "{{ (ks_del_get.stdout | from_json) if (ks_del_get.rc | default(1)) == 0 and (ks_del_get.stdout | default('') | length > 0) else {} }}"
  no_log: true
  when: ks_state == 'absent'

- name: Refuse to delete a Secret this repository does not manage
  ansible.builtin.assert:
    that:
      - (ks_cur.metadata.labels | default({}))[k8s_secrets_managed_label] | default('') == k8s_secrets_managed_value or (ks.force | default(false) | bool)
    fail_msg: >-
      {{ ks.namespace }}/{{ ks.name }} does not carry {{ k8s_secrets_managed_label }}={{ k8s_secrets_managed_value }},
      so it was not created by this role. Set force: true on the entry to delete it anyway.
    quiet: true
  when: ks_state == 'absent' and ks_cur | length > 0

- name: Delete the Secret
  ansible.builtin.command:
    argv: [microk8s, kubectl, delete, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", --ignore-not-found]
  register: ks_deleted
  changed_when: ks_deleted.stdout | default('') is search('deleted')
  when: ks_state == 'absent' and ks_cur | length > 0

- name: Report the Secret that would be deleted
  ansible.builtin.debug:
    msg: "{{ ks.namespace }}/{{ ks.name }}: would be deleted"
  when: ks_state == 'absent' and ks_cur | length > 0 and ansible_check_mode

# ---------------------------------------------------------------- state: present
- name: Check the values exist in the vault
  ansible.builtin.assert:
    that:
      - ks_vault_key in (vault_k8s_secrets | default({}))
      - vault_k8s_secrets[ks_vault_key] is mapping
      - vault_k8s_secrets[ks_vault_key] | length > 0
    fail_msg: >-
      {{ ks.namespace }}/{{ ks.name }}: add {{ ks_vault_key }} (a map of key: value) to
      vault_k8s_secrets in k8s_secrets_vault.yml.
    quiet: true
  when:
    - ks_state == 'present'
    - ks_mode == 'replace' or ks_keys_absent | length == 0

- name: Build the desired data
  ansible.builtin.set_fact:
    ks_desired: "{{ (vault_k8s_secrets | default({}))[ks_vault_key] if ks_vault_key in (vault_k8s_secrets | default({})) else {} }}"
  no_log: true
  when: ks_state == 'present'

- name: Encode the desired data
  ansible.builtin.set_fact:
    ks_desired_b64: "{{ dict(ks_desired.keys() | list | zip(ks_desired.values() | map('string') | map('b64encode') | list)) }}"
  no_log: true
  when: ks_state == 'present'

- name: Validate the secret keys
  ansible.builtin.assert:
    that:
      - (ks_desired.keys() | list + ks_keys_absent | list) | select('match', '^[-._a-zA-Z0-9]+$') | list | length == (ks_desired.keys() | list + ks_keys_absent | list) | length
      - ks_desired.keys() | list | intersect(ks_keys_absent | list) | length == 0
    fail_msg: >-
      {{ ks.namespace }}/{{ ks.name }}: secret keys may only contain letters, digits, '-', '_' and '.',
      and a key cannot be both set and listed in keys_absent.
    quiet: true
  when: ks_state == 'present'

- name: Read the existing Secret
  ansible.builtin.command:
    argv: [microk8s, kubectl, get, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", -o, json, --ignore-not-found]
  register: ks_get
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: ks_state == 'present'

- name: Parse the existing Secret
  ansible.builtin.set_fact:
    ks_cur: "{{ (ks_get.stdout | from_json) if (ks_get.rc | default(1)) == 0 and (ks_get.stdout | default('') | length > 0) else {} }}"
  no_log: true
  when: ks_state == 'present'

- name: Read the existing data
  ansible.builtin.set_fact:
    ks_exists: "{{ ks_cur | length > 0 }}"
    ks_cur_data: "{{ ks_cur.data | default({}) }}"
    ks_cur_type: "{{ ks_cur.type | default('') }}"
    ks_cur_managed: "{{ (ks_cur.metadata.labels | default({}))[k8s_secrets_managed_label] | default('') == k8s_secrets_managed_value }}"
  no_log: true
  when: ks_state == 'present'

- name: Refuse to change the type of an existing Secret
  ansible.builtin.assert:
    that:
      - not (ks_exists | bool) or ks_cur_type == ks_type or (ks.recreate | default(false) | bool)
    fail_msg: >-
      {{ ks.namespace }}/{{ ks.name }} has type {{ ks_cur_type }}, not {{ ks_type }}. The type of a Secret
      is immutable: set recreate: true on the entry to delete and create it again.
    quiet: true
  when: ks_state == 'present'

- name: Work out what differs
  ansible.builtin.set_fact:
    ks_recreate: "{{ ks_exists | bool and ks_cur_type != ks_type }}"
  no_log: true
  when: ks_state == 'present'

- name: Work out the keys that differ
  ansible.builtin.set_fact:
    ks_changed_json: >-
      {%- set base = {} if (ks_recreate | bool or not (ks_exists | bool)) else ks_cur_data -%}
      {%- set out = [] -%}
      {%- for k, v in ks_desired_b64.items() -%}
      {%- if base.get(k) != v -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}
    ks_removed_json: >-
      {%- set base = {} if (ks_recreate | bool or not (ks_exists | bool)) else ks_cur_data -%}
      {%- set out = [] -%}
      {%- for k in base.keys() -%}
      {%- if (ks_mode == 'replace' and k not in ks_desired_b64) or (ks_mode == 'merge' and k in ks_keys_absent) -%}
      {%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  no_log: true
  when: ks_state == 'present'

- name: Decide the actions
  ansible.builtin.set_fact:
    ks_changed_keys: "{{ ks_changed_json | from_json }}"
    ks_removed_keys: "{{ ks_removed_json | from_json }}"
  no_log: true
  when: ks_state == 'present'

- name: Decide the write operations
  ansible.builtin.set_fact:
    ks_do_apply: >-
      {{ ks_desired_b64 | length > 0
         and (ks_recreate | bool or not (ks_exists | bool)
              or (ks_mode == 'replace' and (ks_changed_keys | length > 0 or not (ks_cur_managed | bool)))) }}
    ks_do_patch: >-
      {{ ks_mode == 'merge' and ks_exists | bool and not (ks_recreate | bool)
         and (ks_changed_keys | length > 0 or ks_removed_keys | length > 0 or not (ks_cur_managed | bool)) }}
    ks_do_remove: "{{ ks_mode == 'replace' and ks_exists | bool and not (ks_recreate | bool) and ks_removed_keys | length > 0 }}"
  no_log: true
  when: ks_state == 'present'

- name: Delete the Secret before it is created with another type
  ansible.builtin.command:
    argv: [microk8s, kubectl, delete, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", --ignore-not-found]
  when: ks_state == 'present' and ks_recreate | bool
  changed_when: true

- name: Ensure the namespace exists
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      microk8s kubectl create namespace {{ ks.namespace | quote }} --dry-run=client -o yaml | microk8s kubectl apply -f -
    executable: /bin/bash
  register: ks_ns
  changed_when: ks_ns.stdout | default('') is search('created')
  when: ks_state == 'present' and (ks_do_apply | bool or ks_do_patch | bool)

- name: Apply the Secret
  ansible.builtin.command:
    argv: [microk8s, kubectl, apply, --server-side, --force-conflicts, -f, "-"]
    stdin: >-
      {{ {'apiVersion': 'v1', 'kind': 'Secret',
          'metadata': {'name': ks.name, 'namespace': ks.namespace, 'labels': ks_labels},
          'type': ks_type, 'data': ks_desired_b64} | to_json }}
  changed_when: true
  no_log: true
  when: ks_state == 'present' and ks_do_apply | bool

- name: Remove the keys that are no longer declared
  ansible.builtin.command:
    argv: [microk8s, kubectl, patch, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", --type=json, --patch-file=/dev/stdin]
    stdin: >-
      {%- set ops = [] -%}
      {%- for k in ks_removed_keys -%}{%- set _ = ops.append({'op': 'remove', 'path': '/data/' ~ k}) -%}{%- endfor -%}
      {{ ops | to_json }}
  changed_when: true
  no_log: true
  when: ks_state == 'present' and ks_do_remove | bool

- name: Patch the Secret (merge)
  ansible.builtin.command:
    argv: [microk8s, kubectl, patch, secret, "{{ ks.name }}", -n, "{{ ks.namespace }}", --type=merge, --patch-file=/dev/stdin]
    stdin: >-
      {%- set data = {} -%}
      {%- for k in ks_changed_keys -%}{%- set _ = data.update({k: ks_desired_b64[k]}) -%}{%- endfor -%}
      {%- for k in ks_removed_keys -%}{%- set _ = data.update({k: None}) -%}{%- endfor -%}
      {{ {'metadata': {'labels': ks_labels}, 'data': data} | to_json }}
  changed_when: true
  no_log: true
  when: ks_state == 'present' and ks_do_patch | bool

- name: Report the planned change
  ansible.builtin.debug:
    msg: >-
      {{ ks.namespace }}/{{ ks.name }}: would
      {{ 'recreate' if ks_recreate | bool else ('create' if not (ks_exists | bool) else 'update') }}
      ({{ ks_mode }}; set keys: {{ ks_changed_keys }}; removed keys: {{ ks_removed_keys }})
  when:
    - ks_state == 'present'
    - ansible_check_mode
    - ks_do_apply | bool or ks_do_patch | bool or ks_do_remove | bool
