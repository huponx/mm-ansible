---
- name: Ensure ArgoCD namespace exists
  ansible.builtin.shell: >-
    set -o pipefail;
    microk8s kubectl create namespace "{{ argocd_namespace }}" --dry-run=client -o yaml
    | microk8s kubectl apply -f -
  args:
    executable: /bin/bash
  register: ns_apply
  changed_when: "'created' in ns_apply.stdout"

# The manifest is only fetched again when the file is missing or the pinned version changes,
# so a normal run neither re-downloads nor re-applies it.
- name: Download ArgoCD install manifest
  ansible.builtin.get_url:
    url: "{{ argocd_install_manifest_url }}"
    dest: "/tmp/argocd-install-{{ argocd_version }}.yaml"
    mode: "0644"
    checksum: "{{ argocd_install_manifest_checksum | default(omit, true) }}"
  register: argocd_manifest

# A run that failed after the download must not leave ArgoCD half installed:
# apply again when the server deployment is missing.
- name: Check whether ArgoCD is installed
  ansible.builtin.command: >-
    microk8s kubectl get deployment/argocd-server -n {{ argocd_namespace }}
  register: argocd_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Server-side apply avoids storing the full resource in last-applied-configuration,
# which would exceed the 256KB annotation limit on the applicationsets.argoproj.io CRD.
- name: Apply ArgoCD install manifest (server-side)
  ansible.builtin.command: >-
    microk8s kubectl apply -f /tmp/argocd-install-{{ argocd_version }}.yaml
    -n {{ argocd_namespace }} --server-side --force-conflicts
  register: argocd_apply
  changed_when: true
  when: >-
    argocd_manifest.changed or argocd_installed.rc | default(1) != 0
    or argocd_force_apply | default(false) | bool

- name: Wait for ArgoCD server deployment to be ready
  ansible.builtin.command: >-
    microk8s kubectl wait --for=condition=available
    deployment/argocd-server -n {{ argocd_namespace }} --timeout=300s
  changed_when: false
  when: argocd_wait_ready | bool
