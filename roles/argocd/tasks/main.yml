- name: Install ArgoCD
  include_tasks: install.yml

- name: Configure ArgoCD ingress (subpath and TLS at ingress)
  include_tasks: ingress.yml
  when: argocd_ingress_enabled | default(false) | bool

- name: Configure ArgoCD accounts and RBAC
  include_tasks: users.yml
  when: argocd_users | length > 0

- name: Configure ArgoCD repositories and root applications
  include_tasks: repositories.yml
  when: (argocd_repositories + argocd_repo_credentials + argocd_root_apps) | length > 0

