# Image pull secrets (kubernetes.io/dockerconfigjson) for private registries such as ghcr.io.
# Credentials come from vault_argocd_repo_secrets[<secret or name>] (username, password).
# The secret is sent on stdin and applied server-side, so it never lands in an annotation or a command line.

- name: Validate the image pull secrets
  ansible.builtin.assert:
    that:
      - (argocd_image_pull_secrets | map(attribute='name') | select('match', '^[a-z0-9][a-z0-9.-]*$') | list | length) == argocd_image_pull_secrets | length
      - (argocd_image_pull_secrets | map(attribute='namespace', default='') | select('match', '^[a-z0-9][a-z0-9-]*$') | list | length) == argocd_image_pull_secrets | length
    fail_msg: "Each argocd_image_pull_secrets entry needs a lowercase name and a namespace."
    quiet: true

- name: Check the pull secret credentials exist in the vault
  ansible.builtin.assert:
    that:
      - (item.secret | default(item.name)) in (vault_argocd_repo_secrets | default({}))
      - vault_argocd_repo_secrets[item.secret | default(item.name)].username | default('') | length > 0
      - vault_argocd_repo_secrets[item.secret | default(item.name)].password | default('') | length > 0
    fail_msg: >-
      {{ item.name }}: add {{ item.secret | default(item.name) }} (username and password) to
      vault_argocd_repo_secrets in argocd_vault.yml.
    quiet: true
  loop: "{{ argocd_image_pull_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') != 'absent'
  no_log: true

- name: Create the namespaces of the pull secrets
  ansible.builtin.command:
    argv: [microk8s, kubectl, apply, -f, "-"]
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Namespace', 'metadata': {'name': item}} | to_json }}"
  loop: >-
    {{ (argocd_image_pull_secrets | selectattr('state', 'undefined') | list
        + argocd_image_pull_secrets | selectattr('state', 'defined') | rejectattr('state', 'equalto', 'absent') | list)
       | map(attribute='namespace') | unique | list }}
  register: argocd_pull_ns
  changed_when: "'created' in argocd_pull_ns.stdout"

- name: Apply the pull secrets
  ansible.builtin.command:
    argv:
      - microk8s
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - -f
      - "-"
    stdin: >-
      {{ {
        'apiVersion': 'v1', 'kind': 'Secret',
        'metadata': {'name': item.name, 'namespace': item.namespace},
        'type': 'kubernetes.io/dockerconfigjson',
        'stringData': {'.dockerconfigjson': {'auths': {item.registry | default('ghcr.io'): {
          'username': vault_argocd_repo_secrets[item.secret | default(item.name)].username,
          'password': vault_argocd_repo_secrets[item.secret | default(item.name)].password,
          'auth': (vault_argocd_repo_secrets[item.secret | default(item.name)].username ~ ':'
                   ~ vault_argocd_repo_secrets[item.secret | default(item.name)].password) | b64encode}}} | to_json}
      } | to_json }}
  loop: "{{ argocd_image_pull_secrets }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  when: item.state | default('present') != 'absent'
  register: argocd_pull_apply
  changed_when: "'serverside-applied' in argocd_pull_apply.stdout and 'unchanged' not in argocd_pull_apply.stdout"
  no_log: true

# The ServiceAccount is created by Kubernetes a moment after the namespace.
- name: Add the pull secrets to their ServiceAccount
  ansible.builtin.command:
    argv:
      - microk8s
      - kubectl
      - patch
      - serviceaccount
      - "{{ item.service_account | default('default') }}"
      - -n
      - "{{ item.namespace }}"
      - -p
      - "{{ {'imagePullSecrets': [{'name': item.name}]} | to_json }}"
  loop: "{{ argocd_image_pull_secrets }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  when: item.state | default('present') != 'absent' and item.service_account | default('default') != 'none'
  register: argocd_pull_sa
  retries: 6
  delay: 5
  until: argocd_pull_sa.rc == 0
  changed_when: "'no change' not in argocd_pull_sa.stdout"

- name: Remove the pull secrets marked absent
  ansible.builtin.command: >-
    microk8s kubectl delete secret {{ item.name }} -n {{ item.namespace }} --ignore-not-found
  loop: "{{ argocd_image_pull_secrets }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  when: item.state | default('present') == 'absent'
  register: argocd_pull_delete
  changed_when: "'deleted' in argocd_pull_delete.stdout"
