---
# Pinned release tag. Change it on purpose to upgrade ArgoCD.
argocd_version: "v2.13.3"
argocd_namespace: "argocd"
argocd_wait_ready: true
argocd_install_manifest_url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"

# Ingress at subpath (e.g. https://host/argocd)
argocd_ingress_enabled: true
argocd_external_url: ""
argocd_path: "/"
argocd_server_rootpath: ""
argocd_server_basehref: "/"
argocd_ingress_host: ""
argocd_ingress_class: "nginx"
argocd_ingress_tls_secret: "argocd-server-tls"
argocd_ingress_use_cert_manager: true
argocd_ingress_cluster_issuer: "letsencrypt-prod"
argocd_ingress_force_ssl_redirect: true

# ── Local accounts ────────────────────────────────────────────────────────────
# The built-in `admin` account is left as it is. Every present user needs a password in
# vault_argocd_user_passwords (group_vars/all/argocd_vault.yml, ansible-vault).
#   argocd_users:
#     - name: hung
#       role: admin               # ArgoCD role: admin | readonly | a role from argocd_rbac_extra_policy
#       apikey: false             # true lets the account create API tokens
#       rotate_password: false    # apply the vault password to an existing account, then remove the flag
#     - name: old-user
#       state: absent             # removes the account and its password
argocd_users: []

# true = the vault is the only source of truth: a password changed in the ArgoCD UI is put back
# to the vault value on the next run (which also signs that user out). false = only set the
# password of an account that has none, or with rotate_password.
argocd_enforce_passwords: true

# RBAC (managed by this role when argocd_users is not empty: policy.csv is overwritten).
argocd_rbac_default_policy: "role:readonly"
# Extra lines for policy.csv, for example custom roles:
#   argocd_rbac_extra_policy: |
#     p, role:deployer, applications, sync, */*, allow
argocd_rbac_extra_policy: ""

# ── Repositories ──────────────────────────────────────────────────────────────
# Credentials: vault_argocd_repo_secrets in group_vars/all/argocd_vault.yml, keyed by name:
#   token: { username: ..., password: ... }      ssh: { ssh_private_key: | ... }
# One repository (auth: none for a public repository, nothing to put in the vault):
#   argocd_repositories:
#     - { name: mm-deploy, url: "https://github.com/huponx/mm-deploy.git", auth: token }
#     # secret: <vault key> shares one vault entry between several repositories (default: name)
#     # Helm charts stored in an OCI registry (GHCR). The url has no oci:// prefix. A private registry needs
#     # a classic PAT with read:packages in the vault (fine-grained PATs do not work with GHCR):
#     - { name: ghcr-charts, type: helm, oci: true, url: "ghcr.io/huponx/charts", auth: token }
#     - { name: old, url: "https://example.com/old.git", state: absent }
argocd_repositories: []

# One credential for every repository whose URL starts with `url` (no per-repository secret needed):
#   argocd_repo_credentials:
#     - { name: huponx, url: "https://github.com/huponx", auth: token }
argocd_repo_credentials: []

# Application that points at a directory of Application manifests (app of apps):
#   argocd_root_apps:
#     - name: root-production
#       repo_url: "https://github.com/huponx/mm-deploy.git"
#       path: applications/production
#       revision: main          # default
#       recurse: false          # also read sub-directories
#       automated: true         # sync by itself (default)
#       prune: false            # delete what is removed from git (default false)
#       self_heal: true         # undo manual changes (default)
#       cascade_delete: true    # finalizer: deleting it also deletes its child Applications (default)
argocd_root_apps: []

# Pull secrets for private images (kubelet pulls images, not ArgoCD). The secret is created in each namespace
# and added to the `default` ServiceAccount (or the one named) so Pods use it without imagePullSecrets.
# Credentials: vault_argocd_repo_secrets[<secret or name>] with username and password (classic PAT, read:packages).
#   argocd_image_pull_secrets:
#     - name: ghcr-pull
#       namespace: application
#       registry: ghcr.io               # default
#       service_account: default        # default
#       # secret: <vault key>           # default: name
#       # state: absent                 # removes the secret
argocd_image_pull_secrets: []
