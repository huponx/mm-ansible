---
# Keeps one managed `hosts` block in the Corefile of the CoreDNS ConfigMap and restarts CoreDNS when it changes.
# The block sits between two marker comments, so the rest of the Corefile (MicroK8s dns add-on) is never touched.
# Re-enabling the dns add-on resets the ConfigMap: run `make deploy TAGS=coredns` again afterwards.

- name: Validate the CoreDNS hosts
  ansible.builtin.assert:
    that:
      - coredns_hosts is sequence
      - (coredns_hosts | map(attribute='ip', default='') | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$|^[0-9a-fA-F:]+$') | list | length) == coredns_hosts | length
      - (coredns_hosts | map(attribute='names', default=[]) | select('sequence') | reject('string') | map('length') | select('gt', 0) | list | length) == coredns_hosts | length
    fail_msg: "Each coredns_hosts entry needs an ip and a non-empty list names."
    quiet: true

- name: Read the CoreDNS ConfigMap
  ansible.builtin.command:
    argv: [microk8s, kubectl, -n, "{{ coredns_namespace }}", get, configmap, "{{ coredns_configmap }}", -o, json]
  register: coredns_cm
  changed_when: false
  check_mode: false

- name: Read the Corefile
  ansible.builtin.set_fact:
    coredns_current: "{{ (coredns_cm.stdout | from_json).data.Corefile }}"

- name: Remove the managed block
  ansible.builtin.set_fact:
    coredns_clean: "{{ coredns_current | regex_replace('(?ms)^[ \\t]*# BEGIN mm-ansible hosts\\n.*?# END mm-ansible hosts\\n', '') }}"

- name: Build the managed block
  vars:
    nl: "\n"
  ansible.builtin.set_fact:
    coredns_block: >-
      {%- set lines = ['    # BEGIN mm-ansible hosts', '    hosts {'] -%}
      {%- for h in coredns_hosts -%}
      {%- set _ = lines.append('      ' ~ h.ip ~ ' ' ~ (h.names | join(' '))) -%}
      {%- endfor -%}
      {%- set _ = lines.extend(['      fallthrough', '    }', '    # END mm-ansible hosts', '']) -%}
      {{ lines | join(nl) }}

- name: Insert the managed block
  vars:
    head: "{{ '.:53 {' ~ nl }}"
    nl: "\n"
  ansible.builtin.set_fact:
    coredns_new: >-
      {{ coredns_clean
         if coredns_hosts | length == 0 or head not in coredns_clean
         else (coredns_clean.split(head, 1)[0] ~ head ~ coredns_block ~ coredns_clean.split(head, 1)[1]) }}

- name: Check the Corefile has a server block to extend
  ansible.builtin.assert:
    that:
      - coredns_hosts | length == 0 or coredns_new != coredns_clean
    fail_msg: "The Corefile has no '.:53 {' server block: it was changed by hand, edit it first."
    quiet: true

- name: Update the Corefile
  ansible.builtin.command:
    argv: [microk8s, kubectl, -n, "{{ coredns_namespace }}", patch, configmap, "{{ coredns_configmap }}", --type=merge, --patch-file=/dev/stdin]
    stdin: "{{ {'data': {'Corefile': coredns_new}} | to_json }}"
  when: coredns_new != coredns_current
  changed_when: true
  register: coredns_patched

- name: Restart CoreDNS
  ansible.builtin.command:
    argv: [microk8s, kubectl, -n, "{{ coredns_namespace }}", rollout, restart, "deployment/{{ coredns_deployment }}"]
  when: coredns_patched is changed
  changed_when: true

- name: Show the planned Corefile change
  ansible.builtin.debug:
    msg: "{{ coredns_hosts | length }} host entries would be written to the Corefile and CoreDNS restarted."
  when: ansible_check_mode and coredns_new != coredns_current
