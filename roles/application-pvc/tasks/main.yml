---
- name: Ensure pvc namespaces exist
  ansible.builtin.shell: >-
    set -o pipefail;
    microk8s kubectl create namespace "{{ item }}" --dry-run=client -o yaml
    | microk8s kubectl apply -f -
  args:
    executable: /bin/bash
  loop: "{{ application_pvcs | map(attribute='namespace', default=pvc_default_namespace) | unique | list }}"
  register: ns_apply
  changed_when: "'created' in ns_apply.stdout"

- name: Render PVC manifest
  ansible.builtin.template:
    src: pvc.yaml.j2
    dest: /tmp/application-pvcs.yaml
    mode: "0644"

- name: Apply PVCs
  ansible.builtin.command: "microk8s kubectl apply -f /tmp/application-pvcs.yaml"
  register: pvc_apply
  changed_when: "'unchanged' not in pvc_apply.stdout"

- name: Delete PVCs that are no longer used
  ansible.builtin.command: >-
    microk8s kubectl delete pvc {{ (item.split('/')[-1]) }}
    -n {{ item.split('/')[0] if '/' in item else pvc_default_namespace }}
    --ignore-not-found --wait=false
  loop: "{{ application_pvcs_absent }}"
  register: pvc_delete
  changed_when: "'deleted' in pvc_delete.stdout"
