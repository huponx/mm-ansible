- name: Ensure pvc namespace exists
  ansible.builtin.shell: microk8s kubectl create namespace "{{ pvc_namespace }}"
  register: ns_create
  changed_when: ns_create.rc == 0 and "AlreadyExists" not in (ns_create.stderr | default(''))
  failed_when: ns_create.rc != 0 and "AlreadyExists" not in (ns_create.stderr | default(''))

- name: Render PVC manifest
  template:
    src: pvc.yaml.j2
    dest: /tmp/{{ pvc_name }}-pvc.yaml

- name: Apply PVC
  command: >
    microk8s kubectl apply -f /tmp/{{ pvc_name }}-pvc.yaml