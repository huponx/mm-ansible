# Each entry: name, namespace, storage, storage_class, access_modes (all but name are optional and fall back to
# the pvc_default_* values). application-pvc is kept as it was; dictionary-files is the image and audio store of
# the dictionary service (DICTIONARY_FILES_DIR, mounted by its chart). The claims live outside ArgoCD, so pruning or
# deleting an Application never touches the data. ReadWriteOnce on hostpath works because the cluster has one node:
# with more nodes switch to a ReadWriteMany class or object storage.
application_pvcs:
  - name: application-pvc
  - name: dictionary-files
    storage: 5Gi

# Claims to delete (names, in pvc_default_namespace unless "name" is `<namespace>/<name>`). Empty by default; the
# delete runs with tag `pvc` after the apply, and only removes the names listed here. Delete a claim only after
# the chart that stopped using it has rolled out: a claim a pod still mounts stays `Terminating` (finalizer
# pvc-protection). With the reclaim policy `Delete` (microk8s-hostpath) the PV and its directory go with it.
# Example, after the move from dictionary-images to dictionary-files: application_pvcs_absent: [dictionary-images]
application_pvcs_absent: [dictionary-images]

pvc_default_namespace: application
pvc_default_access_modes:
  - ReadWriteOnce
pvc_default_storage: 1Gi
pvc_default_storage_class: microk8s-hostpath
