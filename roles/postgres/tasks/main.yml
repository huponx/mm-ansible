---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - acl
      - curl
      - gnupg
      - lsb-release
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Download PostgreSQL APT signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Add PostgreSQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts['distribution_release'] }}-pgdg main"
    state: present
    filename: pgdg
    update_cache: true
  become: true

- name: Install PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name: "postgresql-{{ postgres_version }}"
    state: present
    cache_valid_time: 3600
  become: true

- name: Ensure PostgreSQL cluster is initialized
  ansible.builtin.command:
    cmd: "pg_createcluster {{ postgres_version }} main --start"
    creates: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
  become: true

- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  become: true

- name: Set listen_addresses in postgresql.conf
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
    state: present
  become: true
  notify: Restart PostgreSQL

- name: Set port in postgresql.conf
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?port\\s*="
    line: "port = {{ postgres_port }}"
    state: present
  become: true
  notify: Restart PostgreSQL

- name: Use scram-sha-256 for new passwords
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?password_encryption\\s*="
    line: "password_encryption = scram-sha-256"
    state: present
  become: true
  notify: Reload PostgreSQL
  when: postgres_auth_method == 'scram-sha-256'

- name: Apply extra postgresql.conf settings
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = '{{ item.value }}'"
    state: present
  become: true
  loop: "{{ postgres_config | dict2items }}"
  notify: Restart PostgreSQL

# Handlers must run before users are managed: the settings above change how passwords are stored
- name: Apply pending PostgreSQL restarts
  ansible.builtin.meta: flush_handlers

- name: Manage PostgreSQL roles, users and databases
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      tags: [postgres, postgres_users, database]
  when: (postgres_roles + postgres_users + postgres_databases) | length > 0 or postgres_prune_unmanaged != 'off'
  tags: [postgres, postgres_users, database]

- name: Allow connections from configured CIDRs in pg_hba.conf
  ansible.builtin.blockinfile:
    path: "{{ postgres_pg_hba_path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - kubernetes pod access"
    block: |
      {% for cidr in postgres_allowed_cidrs %}
      host    all    all    {{ cidr }}    {{ postgres_auth_method }}
      {% endfor %}
    state: "{{ 'present' if postgres_allowed_cidrs | length > 0 else 'absent' }}"
  become: true
  notify: Reload PostgreSQL

- name: Apply pending PostgreSQL reloads
  ansible.builtin.meta: flush_handlers

- name: Check PostgreSQL accepts connections
  ansible.builtin.command: "pg_isready -p {{ postgres_port }}"
  changed_when: false
  retries: 5
  delay: 2
  register: postgres_ready
  until: postgres_ready.rc == 0
