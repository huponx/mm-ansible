---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - acl
      - curl
      - gnupg
      - lsb-release
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Download PostgreSQL APT signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Add PostgreSQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts['distribution_release'] }}-pgdg main"
    state: present
    filename: pgdg
    update_cache: true
  become: true

- name: Install PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name: "postgresql-{{ postgres_version }}"
    state: present
    cache_valid_time: 3600
  become: true

- name: Ensure PostgreSQL cluster is initialized
  ansible.builtin.command:
    cmd: "pg_createcluster {{ postgres_version }} main --start"
    creates: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
  become: true

- name: Check whether the PostgreSQL cluster exists
  ansible.builtin.stat:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
  register: postgres_conf
  tags: [postgres, postgres_users, database]

# In a dry run on a server that has no PostgreSQL yet, the install above is only simulated:
# there is no service, config file or database to inspect, so the rest cannot be simulated.
- name: Configure PostgreSQL
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      tags: [postgres, postgres_users, database]
  when: not (ansible_check_mode and not postgres_conf.stat.exists)
  tags: [postgres, postgres_users, database]

- name: Note that the configuration is not simulated
  ansible.builtin.debug:
    msg: "PostgreSQL is not installed yet: its configuration is skipped in this dry run."
  when: ansible_check_mode and not postgres_conf.stat.exists
