---
# Kubernetes Secrets managed by `make deploy TAGS=secrets` (role k8s-secrets).
# Values live in k8s_secrets_vault.yml (encrypted with `make vault-encrypt F=...`), under
# vault_k8s_secrets.<secret or <namespace>-<name>>. Secrets not listed here are never touched.
#
# Fields: name, namespace, type (Opaque), mode (replace | merge), keys_absent (merge only),
#         secret (vault key), state (present | absent), force, recreate. See the README.
k8s_secrets:
  # courier and courier-worker (mm-deploy applications/*), namespace application.
  # Vault keys: application-<name>.<key>
  - name: redis-local-credentials           # key password: REDIS_PASSWORD
    namespace: application
  - name: gmail-smtp-credentials            # key password: SMTP_PASSWORD
    namespace: application
  - name: telegram-hung.phamqk-credentials  # key bot-token: TELEGRAM_BOT_TOKEN
    namespace: application

  # bvchain and bvreport (mm-deploy applications/*/bvchain.yaml, bvreport.yaml), namespace application.
  # Vault keys: application-<name>.<key>
  - name: job-bv-credentials                # keys bv-password: BV_PASSWORD, bv-otp-secret: BV_OTP_SECRET
    namespace: application
  - name: telegram-hung.phamqk-chat         # key chat-id: TELEGRAM_CHAT_ID (the chat that receives the messages)
    namespace: application

  # db-migration and identity (mm-deploy applications/*), namespace application.
  # Vault keys: application-<name>.<key>. Each password must match postgres_vault.yml for its user.
  - name: postgres-data-migration-credentials      # data-user-migration (owner, DDL), key password: FLYWAY_PASSWORD
    namespace: application
  - name: postgres-data-rw-credentials     # data-user-rw (DML only), key password: POSTGRES_PASSWORD
    namespace: application

  # identity and gatekeeper (mm-deploy applications/*/identity.yaml, gatekeeper.yaml), namespace application.
  # Vault keys: application-<name>.<key>. Generate the values with `make identity-secrets` (README, "Identity
  # and gatekeeper secrets"); add them to k8s_secrets_vault.yml BEFORE this entry is deployed.
  # Retired signing keys after a rotation go in a Secret `identity-previous-keys` (one key per <kid>.pem), see README.
  - name: identity-signing-key             # key signing.pem: PEM private key (EC P-256), mounted by the chart
    namespace: application
  - name: identity-mfa-key                 # key keys: k1:<base64 32 bytes>, IDENTITY_MFA_KEY (seals the TOTP secrets)
    namespace: application
  - name: gatekeeper-session               # key keys: k1:<base64 32 bytes>, GATEKEEPER_SESSION_KEY (seals tokens in Redis)
    namespace: application
  - name: gatekeeper-client                # key secret: GATEKEEPER_CLIENT_SECRET, printed once by `identityctl client create`
    namespace: application
