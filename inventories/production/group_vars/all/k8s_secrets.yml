---
# Kubernetes Secrets managed by `make deploy TAGS=secrets` (role k8s-secrets).
# Values live in k8s_secrets_vault.yml (encrypted with `make vault-encrypt F=...`), under
# vault_k8s_secrets.<secret or <namespace>-<name>>. Secrets not listed here are never touched.
#
# Fields: name, namespace, type (Opaque), mode (replace | merge), keys_absent (merge only),
#         secret (vault key), state (present | absent), force, recreate. See the README.
k8s_secrets:
  # courier and courier-worker (mm-deploy applications/*), namespace application.
  # Vault keys: application-<name>.<key>
  - name: redis-local-credentials           # key password: REDIS_PASSWORD
    namespace: application
  - name: gmail-smtp-credentials            # key password: SMTP_PASSWORD
    namespace: application
  - name: telegram-hung.phamqk-credentials  # key bot-token: TELEGRAM_BOT_TOKEN
    namespace: application
