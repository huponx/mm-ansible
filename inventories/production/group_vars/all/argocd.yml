---
# ArgoCD: set host so UI is at https://<host>/argocd
argocd_ingress_enabled: true
argocd_ingress_host: "argocd.momofamily.top"
# argocd_version: "stable"
# argocd_path: "/argocd"
# argocd_server_rootpath: "/argocd"
# argocd_server_basehref: "/argocd"
argocd_external_url: "https://argocd.momofamily.top"
argocd_ingress_cluster_issuer: ""
argocd_ingress_tls_secret: ""
argocd_ingress_use_cert_manager: false
argocd_ingress_force_ssl_redirect: false

# Extra local accounts (the built-in `admin` is left as it is). Passwords: argocd_vault.yml.
# See README, "ArgoCD users".
# argocd_users:
#   - name: hung
#     role: admin
argocd_users:
  - name: huponx
    role: admin

# Repositories, shared credentials and root applications. Credentials: argocd_vault.yml
# (vault_argocd_repo_secrets). See README, "ArgoCD repositories and root applications".
# argocd_repositories:
#   - { name: mm-deploy, url: "https://github.com/huponx/mm-deploy.git", auth: token }
# argocd_root_apps:
#   - { name: root-production, repo_url: "https://github.com/huponx/mm-deploy.git", path: applications/production }
argocd_repositories:
  # charts is not listed: ArgoCD reads the charts from oci://ghcr.io, not from that Git repository.
  - name: mm-deploy
    url: https://github.com/huponx/mm-deploy.git
    auth: token
    secret: huponx               # vault key (vault_argocd_repo_secrets.huponx), shared with the entry below
  - name: ghcr-charts            # Helm charts in GHCR (what mm-deploy uses: repoURL oci://ghcr.io/huponx/charts/<name>)
    type: helm
    oci: true
    url: ghcr.io/huponx/charts   # no oci:// prefix; needed only when the packages are private
    auth: token
    secret: ghcr-read            # a classic PAT with read:packages
argocd_repo_credentials:
  - name: huponx
    url: https://github.com/huponx
    auth: token
argocd_root_apps:
  - name: root-production
    repo_url: https://github.com/huponx/mm-deploy.git
    path: applications/production
    recurse: false               # also read sub-directories
    automated: true              # sync by itself (default)
    prune: true                 # delete what is removed from git (default false)
    cascade_delete: true         # finalizer: deleting the root deletes its children

# Pull secret for private images in GHCR (kubelet pulls images). Harmless while the packages are public.
argocd_image_pull_secrets:
  - name: ghcr-pull
    namespace: application
    secret: ghcr-read            # vault key: vault_argocd_repo_secrets.ghcr-read
    service_account: none        # only create the secret; the charts reference it with imagePullSecrets
