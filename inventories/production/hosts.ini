# The server address is not stored in git.
# ANSIBLE_HOST / ANSIBLE_USER / ANSIBLE_SSH_PORT come from the environment:
#   - GitHub Actions: repository variables (see README, "One-time setup")
#   - local runs: .env (see .env.example)
[all]
localserver ansible_host="{{ lookup('ansible.builtin.env', 'ANSIBLE_HOST') }}" ansible_user="{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') | default('ansible', true) }}" ansible_port="{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_PORT') | default('22', true) }}"
