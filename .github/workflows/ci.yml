name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: huponx/actions/.github/actions/ansible-setup@v1

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook playbooks/site.yml --syntax-check

  check:
    name: dry run against the server (read-only)
    # Secrets are not available to forks, and a dry run needs them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only one job talks to the server at a time (same group as deploy).
    concurrency:
      group: ansible-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: huponx/actions/.github/actions/ansible-setup@v1
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASS }}
          host: ${{ vars.ANSIBLE_HOST }}
          user: ${{ vars.ANSIBLE_USER }}
          port: ${{ vars.ANSIBLE_SSH_PORT || '22' }}

      - name: Dry run with diff
        run: |
          set -o pipefail
          ansible-playbook playbooks/site.yml --check --diff 2>&1 | tee ansible-check.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dry run (--check --diff)"
            echo '```'
            grep -A6 "PLAY RECAP" ansible-check.log || echo "No recap found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets
        if: always()
        run: |
          [ -n "${SECRETS_DIR:-}" ] && rm -rf "$SECRETS_DIR" || true
