name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: huponx/actions/.github/actions/ansible-setup@v1

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Self test of the one-shot cleanup script
        run: bash .github/scripts/tests/run.sh

  # Picks what the PR would deploy after the merge (same script as Deploy), so the dry run covers exactly that.
  plan:
    name: plan (what this PR deploys)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick what to dry run
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots: only what the PR changed, not what landed on the base branch meanwhile.
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | bash .github/scripts/deploy-tags.sh
          cat "$GITHUB_OUTPUT"

  check:
    name: dry run against the server (read-only)
    # Secrets are not available to forks, and a dry run needs them.
    # Nothing to deploy (docs, CI, tooling only) = nothing to dry run.
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.mode != 'none'
    needs: [lint, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only one job talks to the server at a time (same group as deploy).
    concurrency:
      group: ansible-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: huponx/actions/.github/actions/ansible-setup@v1
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASS }}
          host: ${{ vars.ANSIBLE_HOST }}
          user: ${{ vars.ANSIBLE_USER }}
          port: ${{ vars.ANSIBLE_SSH_PORT || '22' }}

      - name: Dry run with diff
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -o pipefail
          args=(playbooks/site.yml --check --diff)
          [ -n "$TAGS" ] && args+=(--tags "$TAGS")
          ansible-playbook "${args[@]}" 2>&1 | tee ansible-check.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Dry run (--check --diff)"
            echo "- tags: \`${{ needs.plan.outputs.tags || 'all' }}\`"
            echo ""
            echo '```'
            grep -A6 "PLAY RECAP" ansible-check.log || echo "No recap found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets
        if: always()
        run: |
          [ -n "${SECRETS_DIR:-}" ] && rm -rf "$SECRETS_DIR" || true
